name: Verify Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to verify (for example, 1.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release-candidate:
    name: Verify v${{ inputs.version }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply requested version to verification workspace
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version '$env:RELEASE_VERSION' must be a stable semantic version."
          }
          npm version $env:RELEASE_VERSION --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) {
            throw "npm version failed with exit code $LASTEXITCODE"
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build versioned renderer
        run: npm run build

      - name: Audit release surface
        run: npm run smoke:release
