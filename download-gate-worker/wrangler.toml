name = "scan-master-download-gate"
main = "src/worker.ts"
compatibility_date = "2025-09-01"

# Allowed Origins for CORS. After deploy, replace with your real domain
# (and add a custom domain in dashboard if you want a clean URL).
[vars]
ALLOWED_ORIGINS = "https://amitay1.github.io"
R2_BUCKET = "scan-master-releases"

# R2 binding so the Worker can read latest.json directly (no S3 needed for that).
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "scan-master-releases"

# Secrets set via `wrangler secret put`:
#   ACCESS_CODE             - the single global download code
#   R2_ACCESS_KEY_ID        - R2 S3-API access key (Cloudflare dashboard -> R2 -> Manage R2 API Tokens)
#   R2_SECRET_ACCESS_KEY    - matching secret key
#   R2_S3_ENDPOINT          - https://<ACCOUNT_ID>.r2.cloudflarestorage.com
